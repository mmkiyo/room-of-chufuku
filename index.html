<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中福の部屋</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eee;
      font-family: sans-serif;
      color: #333;
    }


    /* ==========================
       中福のいる画面
    ========================== */

    .room {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      overflow: hidden;

      background-image:
        url("background/room1.jpg");

      background-size: cover;
      background-position: center;
    }


    /* ==========================
       中福
    ========================== */

    .chufuku {

      position: absolute;

      width: 35%;
      max-width: 400px;

      left: 50%;
      bottom: 5%;

      transform:
        translateX(-50%);

      cursor: pointer;

      z-index: 4;

      animation:
        float 3s ease-in-out infinite;
    }


    /* 普段のぷかぷか */

    @keyframes float {

      0% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(0deg);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-8px)
          rotate(-1deg);
      }

      100% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(0deg);
      }

    }


    /* ==========================
       海で泳ぐ
    ========================== */

    .chufuku.swimming {

      animation:
        swim 3s ease-in-out infinite;

    }


    @keyframes swim {

      0% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(-2deg);
      }

      25% {
        transform:
          translateX(-48%)
          translateY(-12px)
          rotate(2deg);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(-2deg);
      }

      75% {
        transform:
          translateX(-52%)
          translateY(10px)
          rotate(2deg);
      }

      100% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(-2deg);
      }

    }


    /* ==========================
       喜ぶ
    ========================== */

    .chufuku.happy {

      animation:
        happy 0.5s ease-in-out 2;

    }


    @keyframes happy {

      0% {
        transform:
          translateX(-50%)
          translateY(0);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-20px);
      }

      100% {
        transform:
          translateX(-50%)
          translateY(0);
      }

    }


    /* ==========================
       遊んでいる中福
    ========================== */

    .chufuku.playing {

      animation:
        playMove 7s ease-in-out;

    }


    /*
       ゆっくり大きく動く
    */

    @keyframes playMove {

      0% {

        left: 50%;
        bottom: 8%;

        transform:
          translateX(-50%)
          rotate(0deg);

      }


      15% {

        left: 20%;
        bottom: 20%;

        transform:
          translateX(-50%)
          rotate(-6deg);

      }


      32% {

        left: 75%;
        bottom: 32%;

        transform:
          translateX(-50%)
          rotate(5deg);

      }


      50% {

        left: 85%;
        bottom: 8%;

        transform:
          translateX(-50%)
          rotate(7deg);

      }


      68% {

        left: 25%;
        bottom: 38%;

        transform:
          translateX(-50%)
          rotate(-5deg);

      }


      84% {

        left: 65%;
        bottom: 48%;

        transform:
          translateX(-50%)
          rotate(4deg);

      }


      100% {

        left: 50%;
        bottom: 8%;

        transform:
          translateX(-50%)
          rotate(0deg);

      }

    }


    /* ==========================
       遊んでいるりんご
    ========================== */

    .play-apple {

      position: absolute;

      width: 70px;

      left: 50%;
      bottom: 30%;

      transform:
        translateX(-50%);

      z-index: 6;

      pointer-events: none;

      display: none;

    }


    .play-apple.playing {

      display: block;

      animation:
        applePlay 7s ease-in-out;

    }


    @keyframes applePlay {

      0% {

        left: 45%;
        bottom: 28%;

        transform:
          translateX(-50%)
          rotate(0deg);

      }


      15% {

        left: 30%;
        bottom: 40%;

        transform:
          translateX(-50%)
          rotate(90deg);

      }


      32% {

        left: 70%;
        bottom: 48%;

        transform:
          translateX(-50%)
          rotate(180deg);

      }


      50% {

        left: 82%;
        bottom: 22%;

        transform:
          translateX(-50%)
          rotate(270deg);

      }


      68% {

        left: 30%;
        bottom: 52%;

        transform:
          translateX(-50%)
          rotate(360deg);

      }


      84% {

        left: 60%;
        bottom: 55%;

        transform:
          translateX(-50%)
          rotate(450deg);

      }


      100% {

        left: 50%;
        bottom: 25%;

        transform:
          translateX(-50%)
          rotate(540deg);

      }

    }


    /* ==========================
       おやつ
    ========================== */

    .snack {

      position: absolute;

      width: 100px;

      left: 50%;
      bottom: 28%;

      transform:
        translateX(-50%);

      display: none;

      pointer-events: none;

      z-index: 6;

    }


    /* ==========================
       セリフ
    ========================== */

    .message {

      position: absolute;

      left: 50%;
      top: 7%;

      transform:
        translateX(-50%);

      background: white;

      padding:
        15px 25px;

      border-radius: 20px;

      font-size: 20px;

      display: none;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,0.15);

      white-space: nowrap;

      text-align: center;

      z-index: 10;

    }


    /* ==========================
       友達の魚
    ========================== */

    .friend-fish {

      position: absolute;

      width: 70px;

      right: -100px;

      pointer-events: none;

      z-index: 3;

    }


    /*
       右 → 左
       そのまま画面外へ
    */

    .friend-fish.fish1 {
      animation:
        fishSwim1 6s linear forwards;
    }

    .friend-fish.fish2 {
      animation:
        fishSwim2 6.5s linear forwards;
    }

    .friend-fish.fish3 {
      animation:
        fishSwim3 6.2s linear forwards;
    }

    .friend-fish.fish4 {
      animation:
        fishSwim4 6.8s linear forwards;
    }

    .friend-fish.fish5 {
      animation:
        fishSwim5 6.3s linear forwards;
    }


    @keyframes fishSwim1 {

      0% {
        right: -100px;
        bottom: 30%;
      }

      100% {
        right: 110%;
        bottom: 45%;
      }

    }


    @keyframes fishSwim2 {

      0% {
        right: -100px;
        bottom: 45%;
      }

      100% {
        right: 110%;
        bottom: 25%;
      }

    }


    @keyframes fishSwim3 {

      0% {
        right: -100px;
        bottom: 25%;
      }

      100% {
        right: 110%;
        bottom: 58%;
      }

    }


    @keyframes fishSwim4 {

      0% {
        right: -100px;
        bottom: 55%;
      }

      100% {
        right: 110%;
        bottom: 35%;
      }

    }


    @keyframes fishSwim5 {

      0% {
        right: -100px;
        bottom: 38%;
      }

      100% {
        right: 110%;
        bottom: 65%;
      }

    }


    /* ==========================
       ステータス
    ========================== */

    .status {

      max-width: 1200px;

      margin: 0 auto;

      padding: 12px;

      background: white;

      text-align: center;

      font-size: 20px;

    }


    /* ==========================
       タブ
    ========================== */

    .tabs {

      max-width: 1200px;

      margin: 0 auto;

      display: flex;

      background: white;

      border-top:
        1px solid #ddd;

    }


    .tab {

      flex: 1;

      border: none;

      border-radius: 0;

      background: white;

      padding:
        14px 5px;

      margin: 0;

      font-size: 16px;

      cursor: pointer;

    }


    .tab.active {

      background: #f1f1f1;

      font-weight: bold;

    }


    /* ==========================
       タブの中身
    ========================== */

    .panel {

      max-width: 1200px;

      margin: 0 auto;

      background: white;

      padding: 15px;

      text-align: center;

      min-height: 100px;

    }


    .panel-title {

      margin-top: 0;

      font-size: 17px;

    }


    .panel button {

      border: none;

      border-radius: 25px;

      padding:
        12px 20px;

      margin: 5px;

      font-size: 17px;

      cursor: pointer;

      background: #f2f2f2;

    }


    .panel button:hover {

      opacity: 0.75;

    }


    /* ==========================
       スマホ
    ========================== */

    @media (max-width: 600px) {

      .room {

        aspect-ratio: 4 / 5;

      }


      .chufuku {

        width: 62%;

        bottom: 8%;

      }


      .message {

        top: 4%;

        font-size: 16px;

        padding:
          10px 16px;

        max-width: 85%;

        white-space: normal;

      }


      .snack {

        width: 70px;

        left: 22%;

        bottom: 30%;

      }


      .play-apple {

        width: 50px;

      }


      .friend-fish {

        width: 48px;

      }


      .status {

        font-size: 17px;

        padding: 10px;

      }


      .tab {

        font-size: 12px;

        padding:
          10px 2px;

      }


      .panel {

        padding: 10px;

      }


      .panel button {

        font-size: 15px;

        padding:
          10px 15px;

      }

    }

  </style>
</head>


<body>


  <!-- ==========================
       中福の部屋
  ========================== -->

  <div
    class="room"
    id="room"
  >


    <!-- 中福 -->

    <img
      src="character/normal.png"
      alt="中福"
      class="chufuku"
      id="chufuku"
      onclick="touchChufuku()"
    >


    <!-- おやつ -->

    <img
      src=""
      alt="おやつ"
      class="snack"
      id="snack"
    >


    <!-- 遊ぶときのりんご -->

    <img
      src="item/apple.png"
      alt="りんご"
      class="play-apple"
      id="playApple"
    >


    <!-- 友達 -->

    <div id="friends"></div>


    <!-- セリフ -->

    <div
      class="message"
      id="message"
    ></div>


  </div>



  <!-- ==========================
       ステータス
  ========================== -->

  <div class="status">

    ❤️ なかよし度：
    <span id="friendship">0</span>

  </div>



  <!-- ==========================
       タブ
  ========================== -->

  <div class="tabs">


    <button
      class="tab active"
      id="tab-home"
      onclick="openTab('home')"
    >

      🏠
      <br>
      お部屋

    </button>


    <button
      class="tab"
      id="tab-food"
      onclick="openTab('food')"
    >

      🍚
      <br>
      ごはん

    </button>


    <button
      class="tab"
      id="tab-friends"
      onclick="openTab('friends')"
    >

      🐟
      <br>
      友達

    </button>


    <button
      class="tab"
      id="tab-touch"
      onclick="openTab('touch')"
    >

      💕
      <br>
      交流

    </button>


    <button
      class="tab"
      id="tab-out"
      onclick="openTab('out')"
    >

      🌊
      <br>
      お出かけ

    </button>


  </div>



  <!-- ==========================
       タブの中身
  ========================== -->

  <div
    class="panel"
    id="panel"
  ></div>



  <script>


    /* ==========================
       なかよし度
    ========================== */

    let friendship =
      Number(
        localStorage.getItem(
          "friendship"
        )
      ) || 0;


    document.getElementById(
      "friendship"
    ).textContent =
      friendship;



    function addFriendship(amount) {

      friendship += amount;


      if (friendship > 100) {

        friendship = 100;

      }


      localStorage.setItem(
        "friendship",
        friendship
      );


      document.getElementById(
        "friendship"
      ).textContent =
        friendship;

    }



    /* ==========================
       タイマー
    ========================== */

    let reactionTimer;



    /* ==========================
       タブ
    ========================== */

    function openTab(tab) {

      const panel =
        document.getElementById(
          "panel"
        );


      document
        .querySelectorAll(".tab")
        .forEach(
          function(button) {

            button.classList.remove(
              "active"
            );

          }
        );


      document
        .getElementById(
          "tab-" + tab
        )
        .classList.add(
          "active"
        );



      /* お部屋 */

      if (tab === "home") {

        panel.innerHTML = `

          <p class="panel-title">
            中福のお部屋
          </p>

          <button
            onclick="touchChufuku()"
          >
            🦭 中福に話しかける
          </button>

        `;

      }



      /* ごはん */

      else if (tab === "food") {

        panel.innerHTML = `

          <p class="panel-title">
            中福に何をあげる？
          </p>

          <button
            onclick="giveSnack('fish')"
          >
            🐟 魚
          </button>

          <button
            onclick="giveSnack('potato')"
          >
            🍟 ポテチ
          </button>

          <button
            onclick="giveSnack('apple')"
          >
            🍎 りんご
          </button>

        `;

      }



      /* 友達 */

      else if (tab === "friends") {

        panel.innerHTML = `

          <p class="panel-title">
            中福の友達
          </p>

          <button
            onclick="callFriends()"
          >
            🐟 友達を呼ぶ
          </button>

        `;

      }



      /* 交流 */

      else if (tab === "touch") {

        panel.innerHTML = `

          <p class="panel-title">
            中福と交流する 🐡
          </p>

          <button
            onclick="petChufuku()"
          >
            🫳 なでる
          </button>

          <button
            onclick="bePetted()"
          >
            🥰 なでられる
          </button>

          <button
            onclick="playTogether()"
          >
            🎮 遊んでもらう
          </button>

        `;

      }



      /* お出かけ */

      else if (tab === "out") {

        panel.innerHTML = `

          <p class="panel-title">
            中福とお出かけする
          </p>

          <button
            onclick="goSea()"
          >
            🌊 海に行く
          </button>

          <button
            onclick="goLand()"
          >
            🏠 お部屋に帰る
          </button>

        `;

      }

    }



    /* ==========================
       中福をタップ
    ========================== */

    function touchChufuku() {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearTimeout(
        reactionTimer
      );


      chufuku.classList.remove(
        "playing"
      );

      chufuku.classList.remove(
        "happy"
      );


      const reactions = [

        "なあに？",

        "呼んだ？",

        "泳ぎたい",

        "どうしたの？",

        "吾唯足知だよ"

      ];


      const random =
        reactions[
          Math.floor(
            Math.random() *
            reactions.length
          )
        ];


      message.textContent =
        random;


      message.style.display =
        "block";


      chufuku.src =
        "character/happy.png";


      addFriendship(1);


      reactionTimer =
        setTimeout(
          function() {

            chufuku.src =
              "character/normal.png";

            message.style.display =
              "none";

          },
          2000
        );

    }



    /* ==========================
       なでる
    ========================== */

    function petChufuku() {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearTimeout(
        reactionTimer
      );


      chufuku.classList.remove(
        "playing"
      );


      chufuku.src =
        "character/heart.png";


      message.textContent =
        "気持ちいいね～";


      message.style.display =
        "block";


      addFriendship(1);


      reactionTimer =
        setTimeout(
          function() {

            chufuku.src =
              "character/normal.png";

            message.style.display =
              "none";

          },
          2500
        );

    }



    /* ==========================
       なでられる
    ========================== */

    function bePetted() {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearTimeout(
        reactionTimer
      );


      chufuku.classList.remove(
        "playing"
      );


      chufuku.src =
        "character/tsurime.png";


      message.textContent =
        "なでてあげよう";


      message.style.display =
        "block";


      addFriendship(2);


      reactionTimer =
        setTimeout(
          function() {

            chufuku.src =
              "character/normal.png";

            message.style.display =
              "none";

          },
          2500
        );

    }



    /* ==========================
       遊んでもらう
    ========================== */

    function playTogether() {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const apple =
        document.getElementById(
          "playApple"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearTimeout(
        reactionTimer
      );


      chufuku.classList.remove(
        "happy"
      );

      chufuku.classList.remove(
        "swimming"
      );


      chufuku.src =
        "character/move.png";


      message.textContent =
        "わーい！あそぼー！";


      message.style.display =
        "block";


      chufuku.classList.add(
        "playing"
      );


      apple.classList.add(
        "playing"
      );


      addFriendship(2);


      reactionTimer =
        setTimeout(
          function() {

            chufuku.classList.remove(
              "playing"
            );


            apple.classList.remove(
              "playing"
            );


            chufuku.src =
              "character/normal.png";


            message.textContent =
              "たのしかった〜!";


            setTimeout(
              function() {

                message.style.display =
                  "none";

              },
              1200
            );

          },
          7000
        );

    }



    /* ==========================
       おやつ
    ========================== */

    function giveSnack(type) {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const snack =
        document.getElementById(
          "snack"
        );

      const message =
        document.getElementById(
          "message"
        );

      const apple =
        document.getElementById(
          "playApple"
        );


      clearTimeout(
        reactionTimer
      );


      apple.classList.remove(
        "playing"
      );


      chufuku.classList.remove(
        "happy"
      );

      chufuku.classList.remove(
        "playing"
      );


      snack.style.display =
        "none";


      message.style.display =
        "none";



      /* 魚 */

      if (type === "fish") {

        snack.src =
          "item/fish.PNG";


        snack.style.display =
          "block";


        chufuku.src =
          "character/music.png";


        message.textContent =
          "わーい!";


        message.style.display =
          "block";


        chufuku.classList.add(
          "happy"
        );


        addFriendship(3);


        reactionTimer =
          setTimeout(
            function() {

              chufuku.classList.remove(
                "happy"
              );


              chufuku.src =
                "character/heart.png";


              message.textContent =
                "すごくおいしいー!";


            },
            2000
          );

      }



      /* ポテチ */

      else if (type === "potato") {

        snack.src =
          "item/potetocrisps.PNG";


        snack.style.display =
          "block";


        chufuku.src =
          "character/music.png";


        message.textContent =
          "わーい!!";


        message.style.display =
          "block";


        chufuku.classList.add(
          "happy"
        );


        addFriendship(2);


        reactionTimer =
          setTimeout(
            function() {

              chufuku.classList.remove(
                "happy"
              );


              chufuku.src =
                "character/tsurime.png";


              reactionTimer =
                setTimeout(
                  function() {

                    chufuku.src =
                      "character/tears.png";


                    message.textContent =
                      "おなかわるい";


                  },
                  1200
                );


            },
            2000
          );

      }



      /* りんご */

      else if (type === "apple") {

        snack.src =
          "item/apple.png";


        snack.style.display =
          "block";


        chufuku.src =
          "character/music.png";


        message.textContent =
          "わーい!ありがとう!";


        message.style.display =
          "block";


        chufuku.classList.add(
          "happy"
        );


        addFriendship(1);


        reactionTimer =
          setTimeout(
            function() {

              chufuku.classList.remove(
                "happy"
              );


              chufuku.src =
                "character/normal.png";


              snack.style.display =
                "none";


              message.style.display =
                "none";


            },
            3000
          );

      }

    }



    /* ==========================
       友達を呼ぶ
    ========================== */

    function callFriends() {

      const friends =
        document.getElementById(
          "friends"
        );

      const message =
        document.getElementById(
          "message"
        );


      friends.innerHTML =
        "";


      message.textContent =
        "友達を呼んでみよう！";


      message.style.display =
        "block";


      /* 5匹の魚 */

      for (
        let i = 1;
        i <= 5;
        i++
      ) {

        const fish =
          document.createElement(
            "img"
          );


        fish.src =
          "item/fish.PNG";


        fish.alt =
          "友達の魚";


        fish.className =
          "friend-fish fish" + i;


        friends.appendChild(
          fish
        );

      }


      addFriendship(2);


      /*
         少しして
         中福が気づく
      */

      setTimeout(
        function() {

          message.textContent =
            "友達……なのか……？";

        },
        1800
      );


      /*
         魚が通り過ぎたあと
      */

      setTimeout(
        function() {

          message.textContent =
            "……行っちゃった。";

        },
        4800
      );


      setTimeout(
        function() {

          message.style.display =
            "none";

        },
        6200
      );

    }



    /* ==========================
       海へ行く
    ========================== */

    function goSea() {

      const room =
        document.getElementById(
          "room"
        );

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const message =
        document.getElementById(
          "message"
        );


      room.style.backgroundImage =
        'url("background/sea1.jpg")';


      chufuku.classList.remove(
        "playing"
      );


      chufuku.classList.add(
        "swimming"
      );


      message.textContent =
        "海に来たよ!";


      message.style.display =
        "block";


      setTimeout(
        function() {

          message.style.display =
            "none";

        },
        2000
      );

    }



    /* ==========================
       陸へ戻る
    ========================== */

    function goLand() {

      const room =
        document.getElementById(
          "room"
        );

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const message =
        document.getElementById(
          "message"
        );


      room.style.backgroundImage =
        'url("background/room1.jpg")';


      chufuku.classList.remove(
        "swimming"
      );

      chufuku.classList.remove(
        "playing"
      );


      message.textContent =
        "お部屋に帰ってきたよ!";


      message.style.display =
        "block";


      setTimeout(
        function() {

          message.style.display =
            "none";

        },
        2000
      );

    }



    /* ==========================
       最初のタブ
    ========================== */

    openTab("home");


  </script>

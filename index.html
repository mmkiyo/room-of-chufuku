<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中福の部屋</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eee;
      font-family: sans-serif;
      color: #333;
    }


    /* ==========================
       中福のいる画面
    ========================== */

    .room {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      overflow: hidden;

      background-image:
        url("background/room1.jpg");

      background-size: cover;
      background-position: center;
    }


    /* ==========================
       中福
    ========================== */

    .chufuku {

      position: absolute;

      width: 35%;
      max-width: 400px;

      left: 50%;
      bottom: 5%;

      transform:
        translateX(-50%);

      cursor: pointer;

      z-index: 4;

      animation:
        float 3s ease-in-out infinite;
    }


    /* 普段のぷかぷか */

    @keyframes float {

      0% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(0deg);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-8px)
          rotate(-1deg);
      }

      100% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(0deg);
      }

    }


    /* ==========================
       海で泳ぐ
    ========================== */

    .chufuku.swimming {

      animation:
        swim 3s ease-in-out infinite;

    }


    @keyframes swim {

      0% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(-2deg);
      }

      25% {
        transform:
          translateX(-48%)
          translateY(-12px)
          rotate(2deg);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(-2deg);
      }

      75% {
        transform:
          translateX(-52%)
          translateY(10px)
          rotate(2deg);
      }

      100% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(-2deg);
      }

    }


    /* ==========================
       喜ぶ
    ========================== */

    .chufuku.happy {

      animation:
        happy 0.5s ease-in-out 2;

    }


    @keyframes happy {

      0% {
        transform:
          translateX(-50%)
          translateY(0);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-20px);
      }

      100% {
        transform:
          translateX(-50%)
          translateY(0);
      }

    }


    /* ==========================
       遊んでいる中福
    ========================== */

    .chufuku.playing {

      animation:
        playMove 7s ease-in-out;

    }


    @keyframes playMove {

      0% {
        left: 50%;
        bottom: 8%;

        transform:
          translateX(-50%)
          rotate(0deg);
      }

      15% {
        left: 20%;
        bottom: 20%;

        transform:
          translateX(-50%)
          rotate(-6deg);
      }

      32% {
        left: 75%;
        bottom: 32%;

        transform:
          translateX(-50%)
          rotate(5deg);
      }

      50% {
        left: 85%;
        bottom: 8%;

        transform:
          translateX(-50%)
          rotate(7deg);
      }

      68% {
        left: 25%;
        bottom: 38%;

        transform:
          translateX(-50%)
          rotate(-5deg);
      }

      84% {
        left: 65%;
        bottom: 48%;

        transform:
          translateX(-50%)
          rotate(4deg);
      }

      100% {
        left: 50%;
        bottom: 8%;

        transform:
          translateX(-50%)
          rotate(0deg);
      }

    }


    /* ==========================
       遊んでいるりんご
    ========================== */

    .play-apple {

      position: absolute;

      width: 70px;

      left: 50%;
      bottom: 30%;

      transform:
        translateX(-50%);

      z-index: 6;

      pointer-events: none;

      display: none;

    }


    .play-apple.playing {

      display: block;

      animation:
        applePlay 7s ease-in-out;

    }


    @keyframes applePlay {

      0% {
        left: 45%;
        bottom: 28%;

        transform:
          translateX(-50%)
          rotate(0deg);
      }

      15% {
        left: 30%;
        bottom: 40%;

        transform:
          translateX(-50%)
          rotate(90deg);
      }

      32% {
        left: 70%;
        bottom: 48%;

        transform:
          translateX(-50%)
          rotate(180deg);
      }

      50% {
        left: 82%;
        bottom: 22%;

        transform:
          translateX(-50%)
          rotate(270deg);
      }

      68% {
        left: 30%;
        bottom: 52%;

        transform:
          translateX(-50%)
          rotate(360deg);
      }

      84% {
        left: 60%;
        bottom: 55%;

        transform:
          translateX(-50%)
          rotate(450deg);
      }

      100% {
        left: 50%;
        bottom: 25%;

        transform:
          translateX(-50%)
          rotate(540deg);
      }

    }


    /* ==========================
       おやつ
    ========================== */

    .snack {

      position: absolute;

      width: 100px;

      left: 50%;
      bottom: 28%;

      transform:
        translateX(-50%);

      display: none;

      pointer-events: none;

      z-index: 6;

    }


    /* ==========================
       セリフ
    ========================== */

    .message {

      position: absolute;

      left: 50%;
      top: 7%;

      transform:
        translateX(-50%);

      max-width: 75%;

      background:
        rgba(255,255,255,0.94);

      padding:
        11px 22px;

      border-radius: 18px;

      font-size: 18px;

      line-height: 1.4;

      display: none;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,0.15);

      white-space: normal;

      text-align: center;

      z-index: 15;

    }


    /* ==========================
       友達の魚
    ========================== */

    .friend-fish {

      position: absolute;

      width: 70px;

      right: -100px;

      pointer-events: none;

      z-index: 3;

    }


    .friend-fish.fish1 {
      animation:
        fishSwim1 6s linear forwards;
    }

    .friend-fish.fish2 {
      animation:
        fishSwim2 6.5s linear forwards;
    }

    .friend-fish.fish3 {
      animation:
        fishSwim3 6.2s linear forwards;
    }

    .friend-fish.fish4 {
      animation:
        fishSwim4 6.8s linear forwards;
    }

    .friend-fish.fish5 {
      animation:
        fishSwim5 6.3s linear forwards;
    }


    @keyframes fishSwim1 {

      0% {
        right: -100px;
        bottom: 30%;
      }

      100% {
        right: 110%;
        bottom: 45%;
      }

    }


    @keyframes fishSwim2 {

      0% {
        right: -100px;
        bottom: 45%;
      }

      100% {
        right: 110%;
        bottom: 25%;
      }

    }


    @keyframes fishSwim3 {

      0% {
        right: -100px;
        bottom: 25%;
      }

      100% {
        right: 110%;
        bottom: 58%;
      }

    }


    @keyframes fishSwim4 {

      0% {
        right: -100px;
        bottom: 55%;
      }

      100% {
        right: 110%;
        bottom: 35%;
      }

    }


    @keyframes fishSwim5 {

      0% {
        right: -100px;
        bottom: 38%;
      }

      100% {
        right: 110%;
        bottom: 65%;
      }

    }


    /* ==========================
       ゲームUI
    ========================== */

    .game-ui {

      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 20;

    }


    /* ==========================
       なかよし度
    ========================== */

    .status {

      position: absolute;

      top: 12px;
      left: 12px;

      padding:
        7px 13px;

      background:
        rgba(255,255,255,0.82);

      border-radius: 20px;

      font-size: 15px;

      text-align: center;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.10);

      pointer-events: auto;

      z-index: 25;

    }


    /* ==========================
       音ボタン
    ========================== */

    .sound-button {

      border: none;

      border-radius: 20px;

      background: #f2f2f2;

      padding:
        5px 12px;

      margin-top: 4px;

      font-size: 13px;

      cursor: pointer;

    }


    .sound-button:hover {

      opacity: 0.75;

    }


    /* ==========================
       タブ
    ========================== */

    .tabs {

      position: absolute;

      left: 3%;
      right: 3%;

      bottom: 2.5%;

      width: 94%;

      display: flex;

      margin: 0;

      background:
        rgba(255,255,255,0.90);

      border:
        1px solid rgba(0,0,0,0.08);

      border-radius: 15px;

      overflow: hidden;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.12);

      pointer-events: auto;

      z-index: 30;

    }


    .tab {

      flex: 1;

      border: none;

      border-radius: 0;

      background:
        rgba(255,255,255,0.70);

      padding:
        8px 5px;

      margin: 0;

      font-size: 14px;

      line-height: 1.2;

      cursor: pointer;

    }


    .tab.active {

      background:
        rgba(235,235,235,0.95);

      font-weight: bold;

    }


    /* ==========================
       選択肢パネル
       PC：左寄り
    ========================== */

    .panel {

      position: absolute;

      left: 4%;

      right: auto;

      bottom: 12%;

      width: 78%;

      max-width: none;

      margin: 0;

      padding:
        8px 10px;

      background:
        rgba(255,255,255,0.88);

      border:
        1px solid rgba(0,0,0,0.08);

      border-radius: 18px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.10);

      text-align: center;

      min-height: 0;

      pointer-events: auto;

      z-index: 29;

    }


    .panel-title {

      margin:
        0 0 4px 0;

      font-size: 15px;

      line-height: 1.2;

    }


    .panel button {

      border: none;

      border-radius: 25px;

      padding:
        8px 17px;

      margin: 3px;

      font-size: 15px;

      cursor: pointer;

      background: #f2f2f2;

    }


    .panel button:hover {

      opacity: 0.75;

    }


    /* ==========================
       スマホ
    ========================== */

    @media (max-width: 600px) {

      body {

        background: #eee;

        overflow-x: hidden;

      }


      /* --------------------------------
         スマホ専用の部屋
      -------------------------------- */

      .room {

        width: 100%;

        height: 100svh;

        min-height: 620px;

        max-height: 900px;

        aspect-ratio: auto;

        margin: 0;

        /* ★ スマホ版背景 */

        background-image:
          url("background/roomforsmartphone1.jpg");

        background-size: cover;

        background-position: center;

      }


      /* --------------------------------
         スマホ版の中福
         ★ 55% → 65% に拡大
      -------------------------------- */

      .chufuku {

        width: 65%;

        max-width: none;

        left: 50%;

        bottom: 28%;

      }


      /* --------------------------------
         セリフ
      -------------------------------- */

      .message {

        top: 20%;

        left: 50%;

        width: auto;

        max-width: 82%;

        padding:
          7px 14px;

        border-radius: 15px;

        font-size: 14px;

        line-height: 1.35;

        white-space: normal;

      }


      /* --------------------------------
         おやつ
      -------------------------------- */

      .snack {

        width: 65px;

        left: 30%;

        bottom: 31%;

      }


      /* --------------------------------
         遊んでいるりんご
      -------------------------------- */

      .play-apple {

        width: 48px;

      }


      /* --------------------------------
         友達の魚
      -------------------------------- */

      .friend-fish {

        width: 48px;

      }


      /* --------------------------------
         なかよし度
      -------------------------------- */

      .status {

        position: absolute;

        top: 8px;
        left: 50%;

        transform:
          translateX(-50%);

        width: auto;

        min-width: 150px;

        padding:
          5px 10px;

        background:
          rgba(255,255,255,0.88);

        border-radius: 20px;

        font-size: 13px;

        z-index: 25;

      }


      /* --------------------------------
         音ボタン
      -------------------------------- */

      .sound-button {

        margin-top: 3px;

        padding:
          4px 10px;

        font-size: 11px;

      }


      /* --------------------------------
         タブ
      -------------------------------- */

      .tabs {

        position: absolute;

        left: 3%;

        right: 3%;

        bottom: 3%;

        width: 94%;

        max-width: none;

        margin: 0;

        background:
          rgba(255,255,255,0.92);

        border:
          1px solid rgba(0,0,0,0.08);

        border-radius: 15px;

        overflow: hidden;

        box-shadow:
          0 3px 12px
          rgba(0,0,0,0.12);

        z-index: 30;

      }


      .tab {

        padding:
          7px 2px;

        font-size: 11px;

        line-height: 1.2;

        background:
          rgba(255,255,255,0.75);

      }


      .tab.active {

        background:
          rgba(235,235,235,0.95);

      }


      /* --------------------------------
         選択肢パネル
      -------------------------------- */

      .panel {

        position: absolute;

        left: 5%;

        right: 5%;

        bottom: 13%;

        width: 90%;

        max-width: none;

        min-height: 0;

        margin: 0;

        padding:
          7px 5px;

        background:
          rgba(255,255,255,0.90);

        border-radius: 15px;

        box-shadow:
          0 3px 12px
          rgba(0,0,0,0.10);

        z-index: 29;

      }


      .panel-title {

        margin:
          0 0 3px 0;

        font-size: 12px;

        line-height: 1.2;

      }


      .panel button {

        padding:
          7px 10px;

        margin:
          2px;

        border-radius: 18px;

        font-size: 12px;

        line-height: 1.2;

      }

    }

  </style>
</head>


<body>


  <div
    class="room"
    id="room"
  >


    <!-- 中福 -->

    <img
      src="character/normal.png"
      alt="中福"
      class="chufuku"
      id="chufuku"
      onclick="touchChufuku()"
    >


    <!-- おやつ -->

    <img
      src=""
      alt="おやつ"
      class="snack"
      id="snack"
    >


    <!-- 遊んでいるりんご -->

    <img
      src="item/apple.png"
      alt="りんご"
      class="play-apple"
      id="playApple"
    >


    <!-- 友達 -->

    <div id="friends"></div>


    <!-- セリフ -->

    <div
      class="message"
      id="message"
    ></div>


    <!-- ==========================
         部屋の上に表示するUI
    ========================== -->

    <div class="game-ui">


      <!-- なかよし度 -->

      <div class="status">

        ❤️ なかよし度：
        <span id="friendship">0</span>

        <br>

        <button
          class="sound-button"
          id="soundButton"
          onclick="toggleSound()"
        >
          🔊 音ON
        </button>

      </div>


      <!-- タブ -->

      <div class="tabs">


        <button
          class="tab active"
          id="tab-home"
          onclick="openTab('home')"
        >
          🏠
          <br>
          お部屋
        </button>


        <button
          class="tab"
          id="tab-food"
          onclick="openTab('food')"
        >
          🍚
          <br>
          ごはん
        </button>


        <button
          class="tab"
          id="tab-friends"
          onclick="openTab('friends')"
        >
          🐟
          <br>
          友達
        </button>


        <button
          class="tab"
          id="tab-touch"
          onclick="openTab('touch')"
        >
          💕
          <br>
          交流
        </button>


        <button
          class="tab"
          id="tab-out"
          onclick="openTab('out')"
        >
          🌊
          <br>
          お出かけ
        </button>


      </div>


      <!-- 選択肢 -->

      <div
        class="panel"
        id="panel"
      ></div>


    </div>


  </div>



  <script>


    /* ==========================
       なかよし度
    ========================== */

    let friendship =
      Number(
        localStorage.getItem(
          "friendship"
        )
      ) || 0;


    document.getElementById(
      "friendship"
    ).textContent =
      friendship;



    function addFriendship(amount) {

      friendship += amount;


      if (friendship > 100) {

        friendship = 100;

      }


      localStorage.setItem(
        "friendship",
        friendship
      );


      document.getElementById(
        "friendship"
      ).textContent =
        friendship;

    }



    /* ==========================
       リアクション用タイマー
    ========================== */

    let reactionTimers = [];


    function setReactionTimer(
      callback,
      delay
    ) {

      const timer =
        setTimeout(
          function() {

            reactionTimers =
              reactionTimers.filter(
                function(item) {
                  return item !== timer;
                }
              );

            callback();

          },
          delay
        );


      reactionTimers.push(
        timer
      );


      return timer;

    }


    function clearReactionTimers() {

      reactionTimers.forEach(
        function(timer) {

          clearTimeout(timer);

        }
      );


      reactionTimers = [];

    }



    /* ==========================
       音
    ========================== */

    let soundEnabled =
      localStorage.getItem(
        "soundEnabled"
      ) !== "false";


    const sounds = {

      apple:
        new Audio("sounds/poi.mp3"),

      sea:
        new Audio("sounds/bubles.mp3"),

      talk:
        new Audio("sounds/piyopiyo.mp3"),

      play:
        new Audio("sounds/jingle_26.mp3"),

      fishSwim:
        new Audio("sounds/wave2.mp3"),

      fishEat:
        new Audio("sounds/pichan2.mp3"),

      /* ★ 正しいファイル名 */

      potato:
        new Audio("sounds/snacks (1).mp3"),

      land:
        new Audio("sounds/pichan.mp3"),

      pet:
        new Audio("sounds/wipes.mp3")

    };


    /* ==========================
       環境音
    ========================== */

    const backgroundSound =
      new Audio("sounds/wave.mp3");


    backgroundSound.loop = true;

    backgroundSound.volume = 0.12;



    function playBackgroundSound() {

      if (!soundEnabled) return;


      backgroundSound
        .play()
        .catch(
          function() {

            console.log(
              "環境音を再生できませんでした"
            );

          }
        );

    }



    function playSound(name) {

      if (!soundEnabled) return;


      const sound =
        sounds[name];


      if (!sound) return;


      sound.currentTime = 0;


      sound.play().catch(
        function() {

          console.log(
            "音を再生できませんでした"
          );

        }
      );

    }



    /* ==========================
       全ての音を停止
    ========================== */

    function stopAllSounds() {

      backgroundSound.pause();

      backgroundSound.currentTime = 0;


      Object.values(
        sounds
      ).forEach(
        function(sound) {

          sound.pause();

          sound.currentTime = 0;

        }
      );

    }



    /* ==========================
       音ON / OFF
    ========================== */

    function toggleSound() {

      soundEnabled =
        !soundEnabled;


      localStorage.setItem(
        "soundEnabled",
        soundEnabled
      );


      const button =
        document.getElementById(
          "soundButton"
        );


      if (soundEnabled) {

        button.textContent =
          "🔊 音ON";


        playBackgroundSound();

      }

      else {

        button.textContent =
          "🔇 音OFF";


        stopAllSounds();

      }

    }



    /* ==========================
       中福を完全に初期状態へ戻す
    ========================== */

    function resetChufuku() {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const snack =
        document.getElementById(
          "snack"
        );

      const apple =
        document.getElementById(
          "playApple"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearReactionTimers();


      chufuku.classList.remove(
        "happy"
      );

      chufuku.classList.remove(
        "playing"
      );


      chufuku.src =
        "character/normal.png";


      snack.src = "";

      snack.style.display =
        "none";


      apple.classList.remove(
        "playing"
      );


      message.textContent =
        "";

      message.style.display =
        "none";

    }



    /* ==========================
       タブ
    ========================== */

    function openTab(tab) {

      const panel =
        document.getElementById(
          "panel"
        );


      document
        .querySelectorAll(".tab")
        .forEach(
          function(button) {

            button.classList.remove(
              "active"
            );

          }
        );


      document
        .getElementById(
          "tab-" + tab
        )
        .classList.add(
          "active"
        );


      playBackgroundSound();



      if (tab === "home") {

        panel.innerHTML = `

          <p class="panel-title">
            中福のお部屋
          </p>

          <button
            onclick="touchChufuku()"
          >
            🦭 中福に話しかける
          </button>

        `;

      }



      else if (tab === "food") {

        panel.innerHTML = `

          <p class="panel-title">
            中福に何をあげる？
          </p>

          <button
            onclick="giveSnack('fish')"
          >
            🐟 魚
          </button>

          <button
            onclick="giveSnack('potato')"
          >
            🍟 ポテチ
          </button>

          <button
            onclick="giveSnack('apple')"
          >
            🍎 りんご
          </button>

        `;

      }



      else if (tab === "friends") {

        panel.innerHTML = `

          <p class="panel-title">
            中福の友達
          </p>

          <button
            onclick="callFriends()"
          >
            🐟 友達を呼ぶ
          </button>

        `;

      }



      else if (tab === "touch") {

        panel.innerHTML = `

          <p class="panel-title">
            中福と交流する 🐡
          </p>

          <button
            onclick="petChufuku()"
          >
            🫳 なでる
          </button>

          <button
            onclick="bePetted()"
          >
            🥰 なでられる
          </button>

          <button
            onclick="playTogether()"
          >
            🎮 遊んでもらう
          </button>

        `;

      }



      else if (tab === "out") {

        panel.innerHTML = `

          <p class="panel-title">
            中福とお出かけする
          </p>

          <button
            onclick="goSea()"
          >
            🌊 海に行く
          </button>

          <button
            onclick="goLand()"
          >
            🏠 お部屋に帰る
          </button>

        `;

      }

    }



    /* ==========================
       中福をタップ
    ========================== */

    function touchChufuku() {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearReactionTimers();


      playBackgroundSound();

      playSound("talk");


      chufuku.classList.remove(
        "playing"
      );

      chufuku.classList.remove(
        "happy"
      );


      const reactions = [

        "なあに？",

        "呼んだ？",

        "泳ぎたい",

        "どうしたの？",

        "吾唯足知だよ"

      ];


      const random =
        reactions[
          Math.floor(
            Math.random() *
            reactions.length
          )
        ];


      message.textContent =
        random;


      message.style.display =
        "block";


      chufuku.src =
        "character/happy.png";


      addFriendship(1);


      setReactionTimer(
        function() {

          chufuku.src =
            "character/normal.png";

          message.style.display =
            "none";

        },
        2000
      );

    }



    /* ==========================
       なでる

        document.getElementById(

        );

      const message =
        document.getElementById(

        );


      clearReactionTimers();


      playBackgroundSound();

      playSound("pet");


      chufuku.classList.remove(
        "playing"
      );


      chufuku.src =
        "character/heart.png";


      message.textContent =

      message.style.display =

      setReactionTimer(
        function() {

          chufuku.src =
            "character/normal.png";

          message.style.display =
            "none";

        },

      );

    /* ==========================
       なでられる
    ========================== */

    function bePetted() {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearReactionTimers();


      playBackgroundSound();


      chufuku.classList.remove(
        "playing"
      );


      chufuku.src =
        "character/tsurime.png";


      message.textContent =
        "なでてあげよう";


      message.style.display =
        "block";


      addFriendship(2);


      setReactionTimer(
        function() {

          chufuku.src =
            "character/normal.png";

          message.style.display =
            "none";

        },
        2500
      );

    }



    /* ==========================
       遊んでもらう
    ========================== */

    function playTogether() {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const apple =
        document.getElementById(
          "playApple"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearReactionTimers();


      playBackgroundSound();

      playSound("play");


      chufuku.classList.remove(
        "happy"
      );

      chufuku.classList.remove(
        "swimming"
      );


      chufuku.src =
        "character/move.png";


      message.textContent =
        "わーい！あそぼー！";


      message.style.display =
        "block";


      chufuku.classList.add(
        "playing"
      );


      apple.classList.add(
        "playing"
      );


      addFriendship(2);


      setReactionTimer(
        function() {

          chufuku.classList.remove(
            "playing"
          );


          apple.classList.remove(
            "playing"
          );


          chufuku.src =
            "character/normal.png";


          message.textContent =
            "たのしかった〜!";


          setReactionTimer(
            function() {

              message.style.display =
                "none";

            },
            1200
          );

        },
        7000
      );

    }



    /* ==========================
       おやつ
    ========================== */

    function giveSnack(type) {

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const snack =
        document.getElementById(
          "snack"
        );

      const message =
        document.getElementById(
          "message"
        );

      const apple =
        document.getElementById(
          "playApple"
        );


      clearReactionTimers();


      playBackgroundSound();


      apple.classList.remove(
        "playing"
      );


      chufuku.classList.remove(
        "happy"
      );

      chufuku.classList.remove(
        "playing"
      );


      snack.style.display =
        "none";


      snack.src =
        "";


      message.style.display =
        "none";



      /* ==========================
         魚
      ========================== */

      if (type === "fish") {

        playSound("fishEat");


        snack.src =
          "item/fish.PNG";


        snack.style.display =
          "block";


        chufuku.src =
          "character/music.png";


        message.textContent =
          "わーい!";


        message.style.display =
          "block";


        chufuku.classList.add(
          "happy"
        );


        addFriendship(3);


        setReactionTimer(
          function() {

            chufuku.classList.remove(
              "happy"
            );


            chufuku.src =
              "character/heart.png";


            message.textContent =
              "すごくおいしいー!";


            setReactionTimer(
              function() {

                resetChufuku();

              },
              1800
            );

          },
          2000
        );

      }



      /* ==========================
         ポテチ
      ========================== */

      else if (type === "potato") {

        /* ★ snacks (1).mp3 を再生 */

        playSound("potato");


        snack.src =
          "item/potetocrisps.PNG";


        snack.style.display =
          "block";


        chufuku.src =
          "character/music.png";


        message.textContent =
          "わーい!!";


        message.style.display =
          "block";


        chufuku.classList.add(
          "happy"
        );


        addFriendship(2);


        setReactionTimer(
          function() {

            chufuku.classList.remove(
              "happy"
            );


            chufuku.src =
              "character/tsurime.png";


            setReactionTimer(
              function() {

                chufuku.src =
                  "character/tears.png";


                message.textContent =
                  "おなかわるい";


                setReactionTimer(
                  function() {

                    resetChufuku();

                  },
                  2000
                );

              },
              1200
            );

          },
          2000
        );

      }



      /* ==========================
         りんご
      ========================== */

      else if (type === "apple") {

        playSound("apple");


        snack.src =
          "item/apple.png";


        snack.style.display =
          "block";


        chufuku.src =
          "character/music.png";


        message.textContent =
          "わーい!ありがとう!";


        message.style.display =
          "block";


        chufuku.classList.add(
          "happy"
        );


        addFriendship(1);


        setReactionTimer(
          function() {

            resetChufuku();

          },
          3000
        );

      }

    }



    /* ==========================
       友達を呼ぶ
    ========================== */

    function callFriends() {

      const friends =
        document.getElementById(
          "friends"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearReactionTimers();


      playBackgroundSound();

      playSound("fishSwim");


      friends.innerHTML =
        "";


      message.textContent =
        "友達を呼んでみよう！";


      message.style.display =
        "block";


      for (
        let i = 1;
        i <= 5;
        i++
      ) {

        const fish =
          document.createElement(
            "img"
          );


        fish.src =
          "item/fish.PNG";


        fish.alt =
          "友達の魚";


        fish.className =
          "friend-fish fish" + i;


        friends.appendChild(
          fish
        );

      }


      addFriendship(2);


      setReactionTimer(
        function() {

          message.textContent =
            "友達……なのか……？";

        },
        1800
      );


      setReactionTimer(
        function() {

          message.textContent =
            "……行っちゃった。";

        },
        4800
      );


      setReactionTimer(
        function() {

          message.style.display =
            "none";


          friends.innerHTML =
            "";

        },
        6200
      );

    }



    /* ==========================
       海へ行く
    ========================== */

    function goSea() {

      const room =
        document.getElementById(
          "room"
        );

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearReactionTimers();


      playBackgroundSound();

      playSound("sea");


      room.style.backgroundImage =
        'url("background/sea1.jpg")';


      chufuku.classList.remove(
        "playing"
      );


      chufuku.classList.remove(
        "happy"
      );


      chufuku.classList.add(
        "swimming"
      );


      chufuku.src =
        "character/normal.png";


      message.textContent =
        "海に来たよ!";


      message.style.display =
        "block";


      setReactionTimer(
        function() {

          message.style.display =
            "none";

        },
        2000
      );

    }



    /* ==========================
       陸へ戻る
    ========================== */

    function goLand() {

      const room =
        document.getElementById(
          "room"
        );

      const chufuku =
        document.getElementById(
          "chufuku"
        );

      const message =
        document.getElementById(
          "message"
        );


      clearReactionTimers();


      playBackgroundSound();

      playSound("land");


      /* --------------------------------
         PCとスマホで背景を変更
      -------------------------------- */

      if (window.innerWidth <= 600) {

        room.style.backgroundImage =
          'url("background/roomforsmartphone1.jpg")';

      }

      else {

        room.style.backgroundImage =
          'url("background/room1.jpg")';

      }


      chufuku.classList.remove(
        "swimming"
      );

      chufuku.classList.remove(
        "playing"
      );

      chufuku.classList.remove(
        "happy"
      );


      chufuku.src =
        "character/normal.png";


      message.textContent =
        "お部屋に帰ってきたよ!";


      message.style.display =
        "block";


      setReactionTimer(
        function() {

          message.style.display =
            "none";

        },
        2000
      );

    }



    /* ==========================
       音ボタンの初期表示
    ========================== */

    function updateSoundButton() {

      const button =
        document.getElementById(
          "soundButton"
        );


      if (soundEnabled) {

        button.textContent =
          "🔊 音ON";

      }

      else {

        button.textContent =
          "🔇 音OFF";

      }

    }



    /* ==========================
       最初のタブ
    ========================== */

    updateSoundButton();

    openTab("home");


  </script>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中福の部屋</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eee;
      font-family: sans-serif;
    }

    .room {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-image: url("background/room1.jpg");
      background-size: cover;
      background-position: center;
    }

    /* 中福 */
    .chufuku {
      position: absolute;
      width: 35%;
      max-width: 400px;
      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);
    }

    /* ぴょんっと喜ぶ */
    .chufuku.happy {
      animation: happy 0.5s ease-in-out 2;
    }

    @keyframes happy {
      0% {
        transform: translateX(-50%) translateY(0);
      }

      50% {
        transform: translateX(-50%) translateY(-20px);
      }

      100% {
        transform: translateX(-50%) translateY(0);
      }
    }

    /* おやつ */
    .snack {
      position: absolute;
      width: 100px;
      left: 50%;
      bottom: 25%;
      transform: translateX(-50%);
      display: none;
    }

    /* セリフ */
    .message {
      position: absolute;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      background: white;
      padding: 15px 25px;
      border-radius: 20px;
      font-size: 20px;
      display: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      white-space: nowrap;
    }

    /* おやつ選択エリア */
    .buttons {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
      background: white;
    }

    .buttons p {
      margin-top: 0;
      font-size: 18px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 14px 24px;
      margin: 5px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="room">

    <!-- 中福 -->
    <img
      src="character/normal.png"
      alt="中福"
      class="chufuku"
      id="chufuku"
    >

    <!-- おやつ -->
    <img
      src=""
      alt="おやつ"
      class="snack"
      id="snack"
    >

    <!-- セリフ -->
    <div class="message" id="message"></div>

  </div>

  <div class="buttons">

    <p>中福に何かあげる？</p>

    <button onclick="giveSnack('fish')">
      🐟 魚
    </button>

    <button onclick="giveSnack('potato')">
      🍟 ポテチ
    </button>

    <button onclick="giveSnack('apple')">
      🍎 りんご
    </button>

  </div>


  <script>

    let reactionTimer;

    function giveSnack(type) {

      const chufuku = document.getElementById("chufuku");
      const snack = document.getElementById("snack");
      const message = document.getElementById("message");

      // 前の反応をリセット
      clearTimeout(reactionTimer);

      chufuku.classList.remove("happy");
      snack.style.display = "none";
      message.style.display = "none";


      // ==========================
      // 魚
      // ==========================

      if (type === "fish") {

        snack.src = "item/fish.PNG";
        snack.style.display = "block";

        chufuku.src = "character/music.png";
        message.textContent = "わーい!";
        message.style.display = "block";

        chufuku.classList.add("happy");


        reactionTimer = setTimeout(function() {

          chufuku.classList.remove("happy");

          chufuku.src = "character/heart.png";
          message.textContent = "すごくおいしいー!";

        }, 2000);
      }


      // ==========================
      // ポテチ
      // ==========================

      else if (type === "potato") {

        snack.src = "item/potetocrisps.PNG";
        snack.style.display = "block";

        chufuku.src = "character/music.png";
        message.textContent = "わーい!!";
        message.style.display = "block";

        chufuku.classList.add("happy");


        reactionTimer = setTimeout(function() {

          chufuku.classList.remove("happy");

          chufuku.src = "character/tsurime.png";

          reactionTimer = setTimeout(function() {

            chufuku.src = "character/tears.png";
            message.textContent = "おなかわるい";

          }, 1200);

        }, 2000);
      }


      // ==========================
      // りんご
      // ==========================

      else if (type === "apple") {

        snack.src = "item/apple.png";
        snack.style.display = "block";

        chufuku.src = "character/music.png";
        message.textContent = "わーい!ありがとう!";
        message.style.display = "block";

        chufuku.classList.add("happy");


        reactionTimer = setTimeout(function() {

          chufuku.classList.remove("happy");

          chufuku.src = "character/normal.png";

          snack.style.display = "none";

        }, 3000);
      }

    }

  </script>

</body>
</html>
